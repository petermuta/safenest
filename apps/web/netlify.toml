# Netlify config for the SafeNest web dashboard (monorepo).
# In Netlify: Base directory = (leave blank), Package directory = apps/web.
# Netlify detects Next.js and applies its Next.js runtime automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Set these in Netlify > Site configuration > Environment variables (not here):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
