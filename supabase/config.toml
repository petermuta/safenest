# Minimal local config. `supabase init` would generate a fuller file; these are the
# SafeNest-specific bits. Merge them in if you re-run `supabase init`.
project_id = "safenest"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "safenest://"]

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# Local testing without sending real SMS: sign in with these numbers and fixed codes.
[auth.sms.test_otp]
256700000100 = "123456"
256700000200 = "123456"
256700000300 = "123456"

# OTP delivery via Africa's Talking. Uncomment once the function is served locally.
# [auth.hook.send_sms]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/send-sms-hook"
# secrets = "env(SEND_SMS_HOOK_SECRET)"

[functions.send-sms-hook]
verify_jwt = false

[functions.sos-dispatch]
verify_jwt = true

[storage]
file_size_limit = "100MiB"
